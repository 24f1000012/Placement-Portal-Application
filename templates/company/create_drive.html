<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Placement Drive</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h2 { color: #667eea; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        textarea { min-height: 100px; }
        .btn { background: #667eea; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #5568d3; }
        .back-link { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('company.dashboard') }}" class="back-link">← Back to Dashboard</a>
        
        <h2>Create New Placement Drive</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="padding: 10px; margin: 10px 0; background: {% if category == 'success' %}#d4edda{% else %}#f8d7da{% endif %}; border-radius: 5px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="form-group">
                <label>Job Title *</label>
                <input type="text" name="job_title" required placeholder="e.g., Software Engineer">
            </div>
            
            <div class="form-group">
                <label>Job Description *</label>
                <textarea name="job_description" required placeholder="Describe the role, responsibilities..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Eligibility Criteria *</label>
                <textarea name="eligibility" required placeholder="e.g., Minimum CGPA 7.0, CS/IT branches only"></textarea>
            </div>
            
            <div class="form-group">
                <label>Salary Range</label>
                <input type="text" name="salary" placeholder="e.g., 6-8 LPA">
            </div>
            
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" placeholder="e.g., Bangalore, Remote">
            </div>
            
            <div class="form-group">
                <label>Application Deadline</label>
                <input type="date" name="application_deadline">
            </div>
            
            <button type="submit" class="btn">Create Drive (Pending Admin Approval)</button>
        </form>
    </div>
</body>
</html>
